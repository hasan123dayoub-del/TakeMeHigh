# Rebuilds the public demo database every night (and on demand), so visitors always find clean data.
# Secrets:
# - DEMO_DATABASE_URL: the direct (non-pooled) Neon connection string of the live demo
# - DEMO_CREDENTIALS_KEY: the same CREDENTIALS_KEY as the API on Vercel (the seed encrypts supplier keys with it)
name: Reset live demo

on:
  schedule:
    - cron: '0 0 * * *' # 03:00 in Syria
  workflow_dispatch:

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      CREDENTIALS_KEY: ${{ secrets.DEMO_CREDENTIALS_KEY }}
      FILE_STORAGE: database
      API_PUBLIC_URL: https://takemehigh-api-hasan.vercel.app
    steps:
      # Check before anything is deleted: a reset without these would leave a half-seeded demo
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$CREDENTIALS_KEY" ]; then
            echo "::error::Set the DEMO_DATABASE_URL and DEMO_CREDENTIALS_KEY secrets first"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:reset
        working-directory: apps/api
