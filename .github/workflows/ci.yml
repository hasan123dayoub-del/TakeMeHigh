name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, unit and e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: takemehigh
          POSTGRES_PASSWORD: takemehigh
          POSTGRES_DB: takemehigh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U takemehigh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://takemehigh:takemehigh@localhost:5432/takemehigh?schema=public
      JWT_SECRET: ci-secret-that-is-long-enough-for-validation-0123456789
      CREDENTIALS_KEY: ci-credentials-key-0123456789
      DISABLE_SCHEDULER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npx tsc --noEmit
        working-directory: apps/api
      - run: npx eslint "src/**/*.ts" "test/**/*.ts"
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm run test:e2e
        working-directory: apps/api
      - name: Demo seed runs on a fresh database
        run: npx tsx prisma/seed.ts
        working-directory: apps/api

  web:
    name: Web — type-check, lint and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
